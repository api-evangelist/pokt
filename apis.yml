apis:
- name: Pocket Network Shannon Chain API
  description: >-
    Cosmos SDK-based REST and gRPC API for interacting with the Pocket Network Shannon protocol chain.
    Provides endpoints for querying applications, suppliers, sessions, gateways, proofs, and tokenomics
    parameters. Also exposes CometBFT RPC for block queries and transaction broadcasting.
  humanURL: https://docs.pocket.network/
  baseURL: https://shannon-grove-rpc.mainnet.poktroll.com
  tags:
  - Cosmos
  - gRPC
  - REST
  - Protocol
  - Blockchain
  properties:
  - type: Documentation
    url: https://docs.pocket.network/
  - type: GitHubRepository
    url: https://github.com/pokt-network/poktroll
  contact:
  - FN: Pocket Network Foundation
    url: https://forum.pokt.network/
- name: Pocket Network PATH Gateway API
  description: >-
    PATH (Pocket API and Toolkit Harness) is an open-source framework for deploying permissionless gateways
    on top of Pocket Network. Exposes health, readiness, and Prometheus metrics endpoints for gateway
    operators, and serves as the relay routing layer between consumers and on-chain supplier nodes.
  humanURL: https://pocket.network/path-gateway/
  baseURL: https://path.grove.city
  tags:
  - Gateway
  - Infrastructure
  - PATH
  - Open Source
