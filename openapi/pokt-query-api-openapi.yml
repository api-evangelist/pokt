components:
  schemas:
    pocket.shared.Supplier:
      type: object
      title: Supplier represents an actor in Pocket Network that provides RPC services
      properties:
        operator_address:
          description: 'Operator address managing the offchain server

            Immutable for supplier''s lifespan - requires unstake/re-stake to change.

            Can update supplier configs except for owner address.'
          type: string
        owner_address:
          type: string
          title: 'Owner address that controls the staked funds and receives rewards by default

            Cannot be updated by the operator'
        service_config_history:
          description: 'List of historical service configuration updates, tracking the suppliers

            services update and corresponding activation heights.'
          type: array
          items:
            type: object
            $ref: '#/components/schemas/pocket.shared.ServiceConfigUpdate'
        services:
          type: array
          title: List of service configurations supported by this supplier
          items:
            type: object
            $ref: '#/components/schemas/pocket.shared.SupplierServiceConfig'
        stake:
          title: Total amount of staked uPOKT
          $ref: '#/components/schemas/cosmos.base.v1beta1.Coin'
        unstake_session_end_height:
          type: string
          format: uint64
          title: Session end height when supplier initiated unstaking (0 if not unstaking)
    pocket.application.QueryAllApplicationsResponse:
      type: object
      properties:
        applications:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/pocket.application.Application'
        pagination:
          $ref: '#/components/schemas/cosmos.base.query.v1beta1.PageResponse'
    pocket.supplier.QueryParamsResponse:
      description: QueryParamsResponse is response type for the Query/Params RPC method.
      type: object
      properties:
        params:
          description: params holds all the parameters of this module.
          $ref: '#/components/schemas/pocket.supplier.Params'
    pocket.tokenomics.MintAllocationPercentages:
      description: 'MintAllocationPercentages captures the distribution of newly minted tokens.

        The sum of all new tokens minted must equal 1.

        GlobalMintTLM: Only used by the GlobalMintTLM at the end of claim settlement.

        TODO_DISTANT_FUTURE: Remove this once global inflation is disabled in perpetuity.'
      type: object
      properties:
        application:
          description: application - % of newley minted tokens sent to the application account address.
          type: number
          format: double
        dao:
          description: dao - % of newley minted tokens sent to the DAO reward address.
          type: number
          format: double
        proposer:
          description: proposer - % of newley minted tokens sent to the block proposer (i.e. validator0 account address.
          type: number
          format: double
        source_owner:
          description: source_owner - % of newley minted tokens sent to the service source owner account address.
          type: number
          format: double
        supplier:
          description: supplier - % of newley minted tokens sent to the block supplier account address.
          type: number
          format: double
    pocket.proof.QueryGetClaimResponse:
      type: object
      properties:
        claim:
          $ref: '#/components/schemas/pocket.proof.Claim'
    pocket.shared.ServiceRevenueShare:
      type: object
      title: ServiceRevenueShare message to hold revenue share configuration details
      properties:
        address:
          type: string
          title: The Bech32 address of the revenue share recipient
        rev_share_percentage:
          type: string
          format: uint64
          title: The percentage of revenue share the recipient will receive
    pocket.service.QueryParamsResponse:
      description: QueryParamsResponse is response type for the Query/Params RPC method.
      type: object
      properties:
        params:
          description: params holds all the parameters of this module.
          $ref: '#/components/schemas/pocket.service.Params'
    pocket.migration.QueryAllMorseClaimableAccountResponse:
      type: object
      properties:
        morseClaimableAccount:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/pocket.migration.MorseClaimableAccount'
        pagination:
          $ref: '#/components/schemas/cosmos.base.query.v1beta1.PageResponse'
    pocket.proof.QueryAllClaimsResponse:
      type: object
      properties:
        claims:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/pocket.proof.Claim'
        pagination:
          $ref: '#/components/schemas/cosmos.base.query.v1beta1.PageResponse'
    pocket.gateway.Params:
      description: Params defines the parameters for the module.
      type: object
      properties:
        min_stake:
          description: min_stake is the minimum amount of uPOKT that a gateway must stake.
          $ref: '#/components/schemas/cosmos.base.v1beta1.Coin'
    cosmos.base.query.v1beta1.PageResponse:
      description: "PageResponse is to be embedded in gRPC response messages where the\ncorresponding request message has used PageRequest.\n\n message SomeResponse {\n         repeated Bar results = 1;\n         PageResponse page = 2;\n }"
      type: object
      properties:
        next_key:
          description: 'next_key is the key to be passed to PageRequest.key to

            query the next page most efficiently. It will be empty if

            there are no more results.'
          type: string
          format: byte
        total:
          type: string
          format: uint64
          title: 'total is total number of results available if PageRequest.count_total

            was set, its value is undefined otherwise'
    pocket.tokenomics.Params:
      description: Params defines the parameters for the tokenomics module.
      type: object
      properties:
        dao_reward_address:
          description: 'dao_reward_address is where the DAO''s portion of claims submitted are distributed.


            Bech32 cosmos address'
          type: string
        global_inflation_per_claim:
          description: 'global_inflation_per_claim is the percentage of a claim''s claimable uPOKT amount to be minted on settlement.

            GlobalMintTLM: Only used by the GlobalMintTLM at the end of claim settlement.'
          type: number
          format: double
        mint_allocation_percentages:
          description: 'mint_allocation_percentages represents the distribution of newly minted tokens.

            GlobalMintTLM: Only used by the GlobalMintTLM at the end of claim settlement.'
          $ref: '#/components/schemas/pocket.tokenomics.MintAllocationPercentages'
        mint_equals_burn_claim_distribution:
          description: 'mint_equals_burn_claim_distribution controls how the settlement amount is distributed

            when global inflation is disabled (global_inflation_per_claim = 0).

            MintEqualsBurnTLM: Only used by the MintEqualsBurnTLM at the end of claim settlement.'
          $ref: '#/components/schemas/pocket.tokenomics.MintEqualsBurnClaimDistribution'
    pocket.migration.MorseClaimableAccount:
      description: 'Next free index: 11'
      type: object
      title: "MorseClaimableAccount\n- Onchain (persisted) representation of a Morse account claimable as part of Morse -> Shannon migration\n- Created during MorseAccountState import (see: MsgImportMorseClaimableAccount)\n- Created ONLY ONCE and NEVER deleted (per morse_src_address per network / re-genesis),\n  unless the allow_morse_account_import_overwrite migration param is enabled\n- Updated ONLY ONCE, when claimed (per morse_src_address per network / re-genesis)"
      properties:
        application_stake:
          title: Staked tokens for application actor corresponding to this account address
          $ref: '#/components/schemas/cosmos.base.v1beta1.Coin'
        claimed_at_height:
          type: string
          format: int64
          title: 'Shannon height at which the account was claimed

            Intended to remain empty until the account is claimed'
        morse_output_address:
          description: "ONLY applicable to Morse node/supplier accounts.\nHex-encoded address of the Morse output account/wallet associated with the Morse node/supplier.\n- E.g.: 00f9900606fa3d5c9179fc0c8513078a53a2073e\n- Morse custodial (i.e. owner) address, which owns the staked tokens of the operator.\n  See 'pocket nodes --help' for more information. Note that this refers to the Morse CLI."
          type: string
        morse_src_address:
          description: "Hex-encoded address of the Morse account whose balance will be claimed.\nIf this MorseClaimableAccount represents a Morse node/supplier:\n  - Morse non-custodial (i.e. operator) address.\n  - If morse_output_address is not set, this is the custodial address.\n  - See 'pocket nodes --help' for more information. Note that this refers to the Morse CLI."
          type: string
        shannon_dest_address:
          type: string
          title: 'bech32-encoded address of the Shannon account to mint claimed balance

            Intended to remain empty until the account is claimed'
        supplier_stake:
          title: 'Staked tokens for supplier actor corresponding to this account address

            DEV_NOTE: Context for Morse:

            - Supplier = Servicer or Node (not a full node) in Morse

            - All Validators are Servicers; not all Servicers are Validators

            - Top 100 staked Servicers are validators (automatic)

            - Only accounts for servicer stake balance transition

            TODO_MAINNET(@Olshansk): Develop strategy for bootstrapping validators in Shannon with cosmos ecosystem'
          $ref: '#/components/schemas/cosmos.base.v1beta1.Coin'
        unstaked_balance:
          title: Unstaked upokt tokens (account balance) available for claiming
          $ref: '#/components/schemas/cosmos.base.v1beta1.Coin'
        unstaking_time:
          description: 'The ISO 8601 UTC timestamp after which the Morse node/supplier unbonding period will have elapsed.

            It reflects the "unbonding completion time" of the Morse node/supplier, but is called "unstaking time" to comply with necessary Morse data structures.'
          type: string
          format: date-time
    pocket.gateway.QueryAllGatewaysResponse:
      type: object
      properties:
        gateways:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/pocket.gateway.Gateway'
        pagination:
          $ref: '#/components/schemas/cosmos.base.query.v1beta1.PageResponse'
    pocket.shared.Params:
      description: Params defines the parameters for the module.
      type: object
      properties:
        application_unbonding_period_sessions:
          description: 'application_unbonding_period_sessions is the number of sessions that an application must wait after

            unstaking before their staked assets are moved to their account balance.

            Onchain business logic requires, and ensures, that the corresponding block count of the

            application unbonding period will exceed the end of its corresponding proof window close height.'
          type: string
          format: uint64
        claim_window_close_offset_blocks:
          description: 'claim_window_close_offset_blocks is the number of blocks after the claim window

            open height, at which the claim window closes.'
          type: string
          format: uint64
        claim_window_open_offset_blocks:
          description: 'claim_window_open_offset_blocks is the number of blocks after the session grace

            period height, at which the claim window opens.'
          type: string
          format: uint64
        compute_unit_cost_granularity:
          description: "compute_unit_cost_granularity is the fraction of the base unit (uPOKT) used\nto represent the smallest price of a single compute unit.\ncompute_unit_cost_granularity defines the smallest fraction of uPOKT that can represent\nthe cost of a single compute unit.\n\nIt acts as a denominator in the formula:\n\n  compute_unit_cost_in_uPOKT = compute_units_to_tokens_multiplier / compute_unit_cost_granularity\n\nThis enables high-precision pricing of compute units using integer math.\nFor example:\n\n+-------------------------------+---------------------------------------------+\n| compute_unit_cost_granularity | compute_units_to_tokens_multiplier unit     |\n+-------------------------------+---------------------------------------------+\n| 1                             | uPOKT                                       |\n| 1_000                         | nPOKT (nanoPOKT, 1e-3 uPOKT)                |\n| 1_000_000                     | pPOKT (picoPOKT, 1e-6 uPOKT)                |\n+-------------------------------+---------------------------------------------+\n\n⚠️ Note: This value is a configurable global network parameter (not a constant).\nIt must be a power of 10, allowing precise denomination shifts without affecting\nongoing sessions. This prevents sessions from settling using parameters that\nwere not in effect during their creation."
          type: string
          format: uint64
        compute_units_to_tokens_multiplier:
          description: 'The amount of tokens that a compute unit should translate to when settling a session.

            It is denominated in fractional uPOKT (1/compute_unit_cost_granularity)

            DEV_NOTE: This used to be under x/tokenomics but has been moved here to avoid cyclic dependencies.'
          type: string
          format: uint64
        gateway_unbonding_period_sessions:
          description: 'gateway_unbonding_period_sessions is the number of sessions that a gateway must wait after

            unstaking before their staked assets are moved to its account balance.'
          type: string
          format: uint64
        grace_period_end_offset_blocks:
          description: 'grace_period_end_offset_blocks is the number of blocks, after the session end height,

            during which the supplier can still service payable relays.

            Suppliers will need to recreate a claim for the previous session (if already created) to

            get paid for the additional relays.'
          type: string
          format: uint64
        num_blocks_per_session:
          description: num_blocks_per_session is the number of blocks between the session start & end heights.
          type: string
          format: uint64
        proof_window_close_offset_blocks:
          description: 'proof_window_close_offset_blocks is the number of blocks after the proof window

            open height, at which the proof window closes.'
          type: string
          format: uint64
        proof_window_open_offset_blocks:
          description: 'proof_window_open_offset_blocks is the number of blocks after the claim window

            close height, at which the proof window opens.'
          type: string
          format: uint64
        supplier_unbonding_period_sessions:
          description: 'supplier_unbonding_period_sessions is the number of sessions that a supplier must wait after

            unstaking before their staked assets are moved to their account balance.

            Onchain business logic requires, and ensures, that the corresponding block count of the unbonding

            period will exceed the end of any active claim & proof lifecycles.'
          type: string
          format: uint64
    pocket.proof.Claim:
      type: object
      title: Claim is the serialized object stored onchain for claims pending to be proven
      properties:
        proof_validation_status:
          title: 'Important: This field MUST only be set by proofKeeper#EnsureValidProofSignaturesAndClosestPath'
          $ref: '#/components/schemas/pocket.proof.ClaimProofStatus'
        root_hash:
          description: 'Root hash from smt.SMST#Root().

            TODO_UP_NEXT(@bryanchriswhite, #1497): Dehydrate the claim''s root hash from onchain events.'
          type: string
          format: byte
        session_header:
          description: Session header this claim is for.
          $ref: '#/components/schemas/pocket.session.SessionHeader'
        supplier_operator_address:
          description: 'Address of the supplier''s operator that submitted this claim.


            the address of the supplier''s operator that submitted this claim'
          type: string
    pocket.service.RelayMiningDifficulty:
      description: 'RelayMiningDifficulty is a message used to store the onchain Relay Mining

        difficulty associated with a specific service ID.

        TODO_TECHDEBT: Embed this message in the Service message.'
      type: object
      properties:
        block_height:
          description: 'The block height at which this relay mining difficulty was computed.

            This is needed to determine how much time has passed since the last time

            the exponential moving average was computed.'
          type: string
          format: int64
        num_relays_ema:
          description: The exponential moving average of the number of relays for this service.
          type: string
          format: uint64
        service_id:
          description: The service ID the relay mining difficulty is associated with.
          type: string
        target_hash:
          description: 'The target hash determining the difficulty to mine relays for this service.

            For example, if we use sha256 to hash the (RelayRequest,ReqlayResponse) tuple,

            and the difficulty has 4 leading zero bits, then the target hash would be:

            0b0000111... (until 32 bytes are filled up).'
          type: string
          format: byte
    pocket.shared.Metadata:
      description: 'Metadata message to hold additional metadata for a service.

        The raw bytes are stored on-chain and will be base64 encoded in JSON representations.'
      type: object
      properties:
        experimental_api_specs:
          description: 'EXPERIMENTAL: Serialized API spec limited to 100 KiB when decoded.

            TODO(@future): support dedicated openapi_ / openrpc_ fields once formats stabilize.'
          type: string
          format: byte
    pocket.application.Application:
      type: object
      title: Application represents the onchain definition and state of an application
      properties:
        address:
          type: string
          title: Bech32 address of the application
        delegatee_gateway_addresses:
          description: 'TODO_MAINNET_MIGRATION(@bryanchriswhite): Rename `delegatee_gateway_addresses` to `gateway_addresses_delegated_to` for better clarity and consistency.

            - Update all related configs, comments, variables, and function names throughout the codebase to reflect this change.

            - This field is a non-nullable list of Bech32-encoded delegatee Gateway addresses.'
          type: array
          items:
            type: string
        pending_transfer:
          title: Information about pending application transfers
          $ref: '#/components/schemas/pocket.application.PendingApplicationTransfer'
        pending_undelegations:
          description: 'Mapping of session end heights to gateways being undelegated from

            - Key: Height of the last block of the session when the undelegation transaction was committed

            - Value: List of gateways being undelegated from at that session end height

            TODO_DOCUMENT(@red-0ne): Document the complete flow and rationale behind this mapping.

            - Ensure the documentation explains why tracking pending undelegations by session end height is necessary.

            - See: https://github.com/pokt-network/poktroll/issues/476#issuecomment-2052639906 for context and examples.'
          type: object
          additionalProperties:
            $ref: '#/components/schemas/pocket.application.UndelegatingGatewayList'
        service_configs:
          type: array
          title: "CRITICAL: Must contain EXACTLY ONE service config\n- Enforces a single service configuration per application to prevent over-servicing.\n- Field is repeated for legacy reasons and potential future compatibility.\n- References for rationale:\n  - https://github.com/pokt-network/poktroll/pull/750#discussion_r1735025033\n  - https://www.notion.so/buildwithgrove/Off-chain-Application-Stake-Tracking-6a8bebb107db4f7f9dc62cbe7ba555f7"
          items:
            type: object
            $ref: '#/components/schemas/pocket.shared.ApplicationServiceConfig'
        stake:
          title: Total amount of staked uPOKT
          $ref: '#/components/schemas/cosmos.base.v1beta1.Coin'
        unstake_session_end_height:
          type: string
          format: uint64
          title: Session end height when application initiated unstaking (0 if not unstaking)
    pocket.shared.ApplicationServiceConfig:
      type: object
      title: ApplicationServiceConfig holds the service configuration the application stakes for
      properties:
        service_id:
          type: string
          title: The Service ID for which the application is configured
    google.rpc.Status:
      type: object
