openapi: 3.2.0
info:
  title: PATH - Path API & Toolkit Harness PATH Path API & Toolkit…
  description: PATH (Path API & Toolkit Harness) is an open source framework for enabling access to a decentralized supply network. It provides various tools and libraries to streamline the integration and interaction with decentralized protocols.
  version: 1.0.0
  contact:
    name: Grove Engineering
    email: engineering@grove.city
servers:
- url: https://{serviceId}.rpc.grove.city
  description: Production PATH URL with service-specific subdomain
  variables:
    serviceId:
      default: eth
      description: The service ID that determines the subdomain
      enum:
      - arb-one
      - arb-sepolia-testnet
      - avax
      - avax-dfk
      - base
      - base-sepolia-testnet
      - bera
      - bitcoin
      - blast
      - boba
      - bsc
      - celo
      - eth
      - eth-holesky-testnet
      - eth-sepolia-testnet
      - fantom
      - fraxtal
      - fuse
      - gnosis
      - harmony
      - ink
      - iotex
      - kaia
      - kava
      - linea
      - mantle
      - metis
      - moonbeam
      - moonriver
      - near
      - oasys
      - op
      - op-sepolia-testnet
      - opbnb
      - pocket
      - poly
      - poly-amoy-testnet
      - poly-zkevm
      - radix
      - scroll
      - sei
      - sonic
      - sui
      - taiko
      - taiko-hekla-testnet
      - tron
      - xrplevm
      - xrplevm-testnet
      - zklink-nova
      - zksync-era
- url: http://localhost:3069
  description: Local PATH instance
security:
- ApiKeyAuth: []
tags:
- name: PATH Path API & Toolkit Harness
paths:
  /v1:
    post:
      tags:
      - PATH Path API & Toolkit Harness
      summary: EVM Service Request
      description: 'Handles EVM service requests. This endpoint processes API requests and forwards them to the appropriate endpoint in the Pocket Network.


        **Server Usage & Authentication:**

        - **Subdomain URLs** (`https://{serviceId}.rpc.grove.city`):

        - Service ID determined from subdomain, no `Target-Service-Id` header needed

        - **Requires** `Portal-Application-ID` header with your Grove Portal Application ID

        - **Optional** `Authorization` header with Grove API Key (if your portal app requires it)

        - **Local PATH** (`http://localhost:3069`):

        - **Requires** `Target-Service-Id` header to specify the service

        - No authentication headers required'
      operationId: 1handleServiceRequest
      parameters:
      - $ref: '#/components/parameters/PortalApplicationIdParam'
      - $ref: '#/components/parameters/PortalAPIKey'
      - $ref: '#/components/parameters/TargetServiceIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  description: JSON-RPC version
                  example: '2.0'
                method:
                  type: string
                  description: Method to call
                  example: eth_blockNumber
                params:
                  type: array
                  description: Parameters for the method
                  items:
                    type: object
                  example: []
                id:
                  type: integer
                  description: Request identifier
                  example: 1
            examples:
              eth_blockNumber:
                summary: Ethereum Block Number Request
                value:
                  jsonrpc: '2.0'
                  method: eth_blockNumber
                  params: []
                  id: 1
              eth_call:
                summary: Call a Contract Method
                value:
                  jsonrpc: '2.0'
                  method: eth_call
                  params:
                  - to: '0x6b175474e89094c44da98b954eedeac495271d0f'
                    data: '0x70a08231000000000000000000000000b5d85cbf7cb3ee0d56b3bb207d5fc4b82f43f511'
                  - latest
                  id: 2
              eth_getTransactionReceipt:
                summary: Get Transaction Receipt
                value:
                  jsonrpc: '2.0'
                  method: eth_getTransactionReceipt
                  params:
                  - '0xb903239f8543d04b5dc1ba6579132b143087c68db1b2168786408fcbce568238'
                  id: 3
              eth_getBlockByNumber:
                summary: Get Block By Number
                value:
                  jsonrpc: '2.0'
                  method: eth_getBlockByNumber
                  params:
                  - '0x1b4'
                  - true
                  id: 4
              eth_getBalance:
                summary: Get Account Balance
                value:
                  jsonrpc: '2.0'
                  method: eth_getBalance
                  params:
                  - '0xc94770007dda54cF92009BFF0dE90c06F603a09f'
                  - latest
                  id: 5
              eth_chainId:
                summary: Get Chain ID
                value:
                  jsonrpc: '2.0'
                  method: eth_chainId
                  params: []
                  id: 6
              eth_getTransactionCount:
                summary: Get Transaction Count for Address
                value:
                  jsonrpc: '2.0'
                  method: eth_getTransactionCount
                  params:
                  - '0xc94770007dda54cF92009BFF0dE90c06F603a09f'
                  - latest
                  id: 7
              eth_getTransactionByHash:
                summary: Get Transaction By Hash
                value:
                  jsonrpc: '2.0'
                  method: eth_getTransactionByHash
                  params:
                  - '0xb903239f8543d04b5dc1ba6579132b143087c68db1b2168786408fcbce568238'
                  id: 8
              eth_gasPrice:
                summary: Get Current Gas Price
                value:
                  jsonrpc: '2.0'
                  method: eth_gasPrice
                  params: []
                  id: 9
      responses:
        '200':
          description: Successful JSON-RPC response
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    description: JSON-RPC version
                    example: '2.0'
                  id:
                    type: integer
                    description: Request identifier that matches the request
                    example: 1
                  result:
                    type: string
                    description: Result of the request (format depends on the method called)
                    example: '0xc96eae'
              examples:
                eth_blockNumber:
                  summary: Ethereum Block Number Response
                  value:
                    jsonrpc: '2.0'
                    id: 1
                    result: '0xc96eae'
                eth_call:
                  summary: Contract Call Response
