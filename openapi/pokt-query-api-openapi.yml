        session:
          $ref: '#/components/schemas/pocket.session.Session'
    pocket.session.Session:
      description: 'Session is a fully hydrated session object that contains all the information for the Session

        and its participants.'
      type: object
      properties:
        application:
          title: A fully hydrated application object this session is for
          $ref: '#/components/schemas/pocket.application.Application'
        header:
          title: The header of the session containing lightweight data
          $ref: '#/components/schemas/pocket.session.SessionHeader'
        num_blocks_per_session:
          type: string
          format: int64
          title: The number of blocks per session when this session started
        session_id:
          type: string
          title: A unique pseudorandom ID for this session
        session_number:
          type: string
          format: int64
          title: The session number since genesis
        suppliers:
          type: array
          title: A fully hydrated set of servicers that are serving the application
          items:
            type: object
            $ref: '#/components/schemas/pocket.shared.Supplier'
    pocket.application.Params:
      description: Params defines the parameters for the module.
      type: object
      properties:
        max_delegated_gateways:
          description: 'max_delegated_gateways defines the maximum number of gateways that a single

            application can delegate to. This is used to prevent performance issues

            in case the relay ring signature becomes too large.'
          type: string
          format: uint64
        min_stake:
          description: min_stake is the minimum stake in upokt that an application must have to remain staked.
          $ref: '#/components/schemas/cosmos.base.v1beta1.Coin'
    google.protobuf.Any:
      type: object
      properties:
        '@type':
          type: string
      additionalProperties: {}
    pocket.gateway.QueryParamsResponse:
      description: QueryParamsResponse is response type for the Query/Params RPC method.
