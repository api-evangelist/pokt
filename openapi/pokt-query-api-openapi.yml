            $ref: '#/components/schemas/pocket.shared.Supplier'
    pocket.tokenomics.MintEqualsBurnClaimDistribution:
      description: 'MintEqualsBurnClaimDistribution captures the distribution of claimable tokens.

        The sum of all tokens being burnt from the application''s stake must equal 1.

        GlobalMintEqualsBurnTLM: Only used by the GlobalMintEqualsBurnTLM at the end of claim settlement.'
      type: object
      properties:
        application:
          description: application - % of claimable tokens sent to the application account address.
          type: number
          format: double
        dao:
          description: dao - % of claimable tokens sent to the DAO reward address.
          type: number
          format: double
        proposer:
          description: 'TODO_TECHDEBT: Rename "proposer" to "validators" to reflect the work done in #1753.

            This will span all references to the term "proposer" across documentation, functions, protobufs, variables, tooling, etc..


            proposer - % of claimable tokens sent to the block proposer (i.e. validator0) account address.'
          type: number
          format: double
        source_owner:
          description: source_owner - % of claimable tokens sent to the service source owner account address.
          type: number
          format: double
        supplier:
          description: supplier - % of claimable tokens sent to the block supplier account address.
          type: number
          format: double
    pocket.session.Params:
      description: Params defines the parameters for the module.
      type: object
      properties:
        num_suppliers_per_session:
          description: 'num_suppliers_per_session is the maximum number of suppliers per session

            (application:supplier pair for a given session number).'
          type: string
          format: uint64
    pocket.proof.ClaimProofStatus:
      type: string
      title: 'Status of proof validation for a claim

        Default is PENDING_VALIDATION regardless of proof requirement'
      default: PENDING_VALIDATION
      enum:
      - PENDING_VALIDATION
      - VALIDATED
      - INVALID
    pocket.supplier.Params:
      description: Params defines the parameters for the module.
      type: object
      properties:
        min_stake:
          description: 'min_stake is the minimum amount of uPOKT that a supplier must stake to be

            included in network sessions and remain staked.'
          $ref: '#/components/schemas/cosmos.base.v1beta1.Coin'
        staking_fee:
          description: staking_fee is the fee charged by the protocol for staking a supplier.
          $ref: '#/components/schemas/cosmos.base.v1beta1.Coin'
    pocket.shared.Service:
      type: object
      title: Service message to encapsulate unique and semantic identifiers for a service on the network
      properties:
        compute_units_per_relay:
          description: Compute units required per relay for this service
          type: string
          format: uint64
          title: 'The cost of a single relay for this service in terms of compute units.

            Must be used alongside the global ''compute_units_to_tokens_multiplier'' to calculate the cost of a relay for this service.

            cost_per_relay_for_specific_service = compute_units_per_relay_for_specific_service * compute_units_to_tokens_multiplier_global_value'
        id:
          description: Unique identifier for the service
          type: string
          title: For example, what if we want to request a session for a certain service but with some additional configs that identify it?
        metadata:
          description: 'Optional metadata containing an experimental API specification for the service.

            When exposed via JSON, this field is base64 encoded and MUST be <= 100 KiB when decoded.'
          $ref: '#/components/schemas/pocket.shared.Metadata'
        name:
          description: (Optional) Human readable description of the service
          type: string
          title: 'TODO_POST_MAINNET: Rename service.name to service.description'
        owner_address:
          description: 'The owner address that created the service.

            It is the address that receives rewards based on the Service''s onchain usage

            It is the only address that can update the service configuration (e.g. compute_units_per_relay),

            or make other updates to it.


            The Bech32 address of the service owner / creator'
          type: string
    pocket.shared.ServiceConfigUpdate:
      description: 'ServiceConfigUpdate tracks a change in a supplier''s service configurations

        at a specific block height, enabling tracking of configuration changes over time.

        This record helps maintain a complete history of service configs and their availability periods.'
      type: object
      properties:
        activation_height:
          type: string
          format: int64
          title: Block height at which this service configuration became active in the network
        deactivation_height:
          type: string
          format: int64
          title: "Block height at which this service configuration was deactivated (0 if still active)\nFor service configs scheduled for deactivation:\n- This field stores the block height when deactivation will occur\n- After deactivation, the config remains in history only as needed for claim settlement\n- Once no longer required for settlement, the config is automatically removed by\n  the EndBlockerPruneSupplierServiceConfigHistory process"
        operator_address:
          type: string
          title: Operator address of the supplier corresponding to the service configuration change
        service:
          title: The specific service configuration that was added, modified or scheduled for removal
          $ref: '#/components/schemas/pocket.shared.SupplierServiceConfig'
