apis:
  - name: Pocket Network Public RPC API
    description: Free, keyless public RPC endpoints for 60+ blockchain networks including Ethereum, Arbitrum, Optimism, Base, Polygon, Avalanche, Solana, NEAR, Sui, and more. No API key required. Endpoints are served through Pocket Network's decentralized gateway layer routing requests across 5000+ independent supplier nodes for redundancy and censorship resistance.
    humanURL: https://api.pocket.network/
    baseURL: https://api.pocket.network
    tags:
      - RPC
      - Blockchain
      - Ethereum
      - EVM
      - Decentralized
